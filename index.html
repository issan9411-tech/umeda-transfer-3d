<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>梅田のりかえ3D</title>
    <meta name="description" content="大阪・梅田の8駅（JR大阪・うめきた・阪急・阪神・御堂筋線梅田・東梅田・西梅田・北新地）の最適乗り換えルートを3Dで算出・シミュレーションするアプリ" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap" />
  </head>
  <body>
    <div class="app">
      <header class="signbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">梅</span>
          <div class="brand-text">
            <h1>梅田のりかえ3D</h1>
            <p>Umeda Transfer Simulator · 8駅 3D経路探索</p>
          </div>
        </div>
        <div class="signbar-meta" id="netStats"></div>
      </header>

      <aside class="panel" id="panel">
        <nav class="tabs" role="tablist" aria-label="パネル切替">
          <button class="tab is-active" role="tab" aria-selected="true" data-tab="route" id="tab-route">ルート検索</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="matrix" id="tab-matrix">乗換時間表</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="about" id="tab-about">モデル解説</button>
        </nav>

        <section class="tabpane" data-pane="route" id="pane-route">
          <form class="od" id="odForm" autocomplete="off">
            <div class="od-row">
              <span class="od-dot od-from" aria-hidden="true"></span>
              <label class="od-label" for="from">のる（出発ホーム）</label>
              <select id="from" class="od-select"></select>
            </div>
            <button type="button" class="swap" id="swap" title="出発と到着を入れ替え" aria-label="出発と到着を入れ替え">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 4v13m0 0-3-3m3 3 3-3M17 20V7m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="od-row">
              <span class="od-dot od-to" aria-hidden="true"></span>
              <label class="od-label" for="to">おりる（到着ホーム）</label>
              <select id="to" class="od-select"></select>
            </div>
          </form>

          <fieldset class="chips" id="profiles">
            <legend>歩き方</legend>
          </fieldset>

          <details class="options" id="optionsBox">
            <summary>条件 <span class="options-summary" id="optSummary"></span></summary>
            <div class="opt-grid">
              <label class="opt" for="objective">優先
                <select id="objective">
                  <option value="time">所要時間</option>
                  <option value="distance">歩行距離</option>
                  <option value="comfort">楽さ（階段・人混み回避）</option>
                </select>
              </label>
              <label class="opt" for="boarding">乗車位置
                <select id="boarding">
                  <option value="best">乗換に便利な位置（推奨）</option>
                  <option value="middle">列車の中ほど</option>
                </select>
              </label>
              <label class="opt" for="day">曜日
                <select id="day">
                  <option value="weekday">平日</option>
                  <option value="holiday">土休日</option>
                </select>
              </label>
              <label class="opt" for="speed">歩行速度 <output id="speedOut" for="speed"></output>
                <input type="range" id="speed" min="0.7" max="2.0" step="0.05" />
              </label>
              <label class="opt opt-wide" for="hour">時刻 <output id="hourOut" for="hour"></output>
                <input type="range" id="hour" min="5" max="24" step="0.25" />
              </label>
              <label class="check" for="congestion"><input type="checkbox" id="congestion" /> 時間帯の混雑を考慮</label>
              <label class="check" for="rain"><input type="checkbox" id="rain" /> 雨の日（屋外を避ける）</label>
            </div>
          </details>

          <div class="visually-hidden" id="resultsStatus" role="status" aria-live="polite"></div>
          <div class="results" id="results"></div>
          <ol class="steps" id="steps"></ol>
        </section>

        <section class="tabpane" data-pane="matrix" id="pane-matrix" hidden>
          <p class="pane-lead">各駅間の乗換所要時間（ホーム→ホーム、改札通過・上下移動を含む）。現在の「歩き方」「条件」で計算しています。セルを押すとその経路を3D表示します。</p>
          <div class="matrix-mode" role="radiogroup" aria-label="表示値">
            <label><input type="radio" name="mmode" value="typicalS" checked /> 標準（列車の中ほどで降車）</label>
            <label><input type="radio" name="mmode" value="bestS" /> 最短（便利な車両で降車）</label>
          </div>
          <div class="matrix-wrap" id="matrixWrap"></div>
          <div class="matrix-legend" id="matrixLegend"></div>
        </section>

        <section class="tabpane about" data-pane="about" id="pane-about" hidden></section>
      </aside>

      <main class="stage" id="stage">
        <div class="scene" id="scene"></div>

        <div class="floorbar" id="floorbar" aria-label="表示する階"></div>

        <div class="hud hud-top">
          <div class="seg" role="group" aria-label="視点">
            <button type="button" data-cam="overview" class="is-active">俯瞰</button>
            <button type="button" data-cam="north">北から</button>
            <button type="button" data-cam="section">断面</button>
            <button type="button" data-cam="top">真上</button>
          </div>
          <label class="hud-range" for="exag">高さ強調 <output id="exagOut" for="exag"></output>
            <input type="range" id="exag" min="1" max="8" step="0.5" value="4" />
          </label>
          <label class="hud-check" for="labels"><input type="checkbox" id="labels" checked /> ラベル</label>
        </div>

        <div class="hud hud-sim">
          <label class="hud-check" for="crowd"><input type="checkbox" id="crowd" /> 群衆シミュレーション</label>
          <label class="hud-check" for="heat"><input type="checkbox" id="heat" /> 混雑ヒートマップ</label>
          <label class="hud-check" for="live"><input type="checkbox" id="live" /> 混雑を経路に反映</label>
          <div class="sim-stats" id="simStats"></div>
        </div>

        <div class="playbar" id="playbar">
          <button type="button" class="play" id="play" aria-label="再生">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path id="playIcon" d="M7 5v14l12-7z" fill="currentColor"/></svg>
          </button>
          <div class="scrub">
            <input type="range" id="scrub" min="0" max="100" step="any" value="0" aria-label="経過時間" />
            <div class="scrub-now" id="scrubNow"></div>
          </div>
          <span class="clock" id="clock">0:00 / 0:00</span>
          <select id="rate" aria-label="再生速度">
            <option value="1">×1</option>
            <option value="4">×4</option>
            <option value="10" selected>×10</option>
            <option value="30">×30</option>
          </select>
          <label class="hud-check" for="follow"><input type="checkbox" id="follow" /> 追従</label>
        </div>

        <div class="legend" id="legend"></div>
        <div class="tip" id="tip" hidden></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
